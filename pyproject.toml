[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imgvec"
version = "0.1.0"
description = "그림 파일을 CAD용 벡터(선·호·원)로 변환하는 엔진 — DNCAD 장치 생성 프로그램 1단계"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.8",
    "pillow>=10",
]

[project.optional-dependencies]
pdf = ["pypdfium2>=4"]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4.20"]

[project.scripts]
imgvec = "imgvec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imgvec = ["data/*.json"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]   # 기본 규칙 + 흔한 버그 패턴
ignore = ["B905"]                        # zip(strict=) 강제하지 않음

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
